name: Exemple 27 (NKWindow) sur macOS

# Construit Jenga/Exemples/27_nk_window sur un vrai Mac (runner GitHub
# macos-latest, Apple Silicon comme un MacBook Air M1/M2/M3), avec le Jenga du
# depot installe par `pip install -e .`. C'est la seule verification REELLE du
# backend Cocoa : il ne se compile pas sous Windows (pas de SDK Apple).
#
# Lancement :
#   - onglet Actions > "Exemple 27 (NKWindow) sur macOS" > Run workflow,
#     en choisissant la branche ;
#   - ou : gh workflow run exemple27-macos.yml --ref <branche> -f config=Debug
#
# GitHub ne propose "Run workflow" que pour un workflow present sur la branche
# PAR DEFAUT. Tant que ce fichier n'y est pas, le declencheur `push` ci-dessous
# fait le travail : pousser une branche fix/exemple27-* qui touche l'exemple
# lance ce workflow tout seul.
#
# Etapes : 1) build (le verdict), 2) tests unitaires NKWindow, 3) Sandbox lance
# quelques secondes pour verifier qu'il demarre sans planter. Les etapes 2 et 3
# sont informatives (continue-on-error) : seul le build fait echouer le job.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Configuration"
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches:
      - 'fix/exemple27-**'
    paths:
      - 'Jenga/Exemples/27_nk_window/**'
      - '.github/workflows/exemple27-macos.yml'

permissions:
  contents: read

concurrency:
  group: exemple27-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CONFIG: ${{ inputs.config || 'Debug' }}
      EXEMPLE: Jenga/Exemples/27_nk_window
      JENGA_ATTENTE_VERROU: '0'   # CI : ne jamais attendre un verrou de binaire
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Jenga depuis le depot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Outils
        run: |
          set -x
          sw_vers
          uname -m
          xcrun --show-sdk-path
          clang++ --version
          jenga --version | tail -n 3

      - name: Build de l'exemple 27 (verdict)
        working-directory: ${{ env.EXEMPLE }}
        run: |
          set -o pipefail
          jenga build --config "$CONFIG" --no-daemon --keep-going 2>&1 | tee build.log

      - name: Binaires produits
        if: always()
        working-directory: ${{ env.EXEMPLE }}
        run: |
          ls -la Build/Bin/ || true
          find Build/Bin -maxdepth 3 -type f \( -name 'Sandbox*' -o -name '*.a' \) -exec file {} \; || true

      - name: Tests unitaires NKWindow
        continue-on-error: true
        working-directory: ${{ env.EXEMPLE }}
        run: |
          set -o pipefail
          jenga test --config "$CONFIG" --no-daemon 2>&1 | tee test.log

      - name: Sandbox lance 6 s (demarrage sans plantage)
        continue-on-error: true
        working-directory: ${{ env.EXEMPLE }}
        run: |
          EXE="Build/Bin/${CONFIG}-macOS/Sandbox/Sandbox"
          if [ ! -x "$EXE" ]; then
            EXE="$(find Build/Bin -type f -perm -u+x -name Sandbox -not -path '*.app/*' | head -n 1)"
          fi
          echo "Executable : ${EXE:-introuvable}"
          test -n "$EXE"
          "$EXE" > sandbox.log 2>&1 &
          PID=$!
          sleep 6
          screencapture -x sandbox.png 2>/dev/null || echo "capture d'ecran refusee par le runner"
          if kill -0 "$PID" 2>/dev/null; then
            echo "Sandbox toujours vivant apres 6 s : demarrage OK"
            kill "$PID"; wait "$PID" 2>/dev/null || true
          else
            CODE=0; wait "$PID" || CODE=$?
            echo "::warning::Sandbox s'est arrete avant 6 s (code $CODE)"
            cat sandbox.log
            exit 1
          fi

      - name: Resume
        if: always()
        working-directory: ${{ env.EXEMPLE }}
        run: |
          {
            echo "### Exemple 27 sur macOS ($CONFIG, $(uname -m))"
            echo '```'
            grep -E "Projects Built|Status|Errors|error:" build.log | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Journaux et binaires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exemple27-macos-${{ env.CONFIG }}
          path: |
            ${{ env.EXEMPLE }}/build.log
            ${{ env.EXEMPLE }}/test.log
            ${{ env.EXEMPLE }}/sandbox.log
            ${{ env.EXEMPLE }}/sandbox.png
            ${{ env.EXEMPLE }}/Build/Bin/
          if-no-files-found: ignore
